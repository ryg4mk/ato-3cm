<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#d8d5cd">
  <title>あと3センチ。 | ONE TAKE GAME #002</title>
  <link rel="stylesheet" href="./style.css">

  <style>
    .otg-back-link {
      position: fixed;
      z-index: 9999;
      left: max(10px, env(safe-area-inset-left));
      bottom: max(10px, env(safe-area-inset-bottom));
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 7px 11px;
      color: #3f382e;
      background: rgba(255, 250, 240, 0.92);
      border: 2px solid #3f382e;
      border-radius: 999px;
      box-shadow: 3px 3px 0 rgba(63, 56, 46, 0.9);
      font: 800 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-decoration: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .otg-back-link:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 rgba(63, 56, 46, 0.9);
    }
  </style>
</head>
<body>
  <a class="otg-back-link" href="https://ryg4mk.github.io/one-take-game/" aria-label="ONE TAKE GAME一覧へ戻る">
    <span aria-hidden="true">←</span>
    <span>ONE TAKE GAME</span>
  </a>

  <main class="app" aria-label="あと3センチ。">
    <section id="titleScreen" class="panel title-panel">
      <div class="eyebrow">ONE TAKE GAME #002</div>
      <h1>あと3センチ。</h1>
      <p class="howto">車は左右に動きながら回転します。<br>タイミングを見て上にスワイプ！<br>空いている駐車スペースに停めよう。</p>
      <button id="startButton" class="primary-button" type="button">スタート</button>
    </section>

    <section id="gameScreen" class="game-screen" hidden>
      <canvas id="gameCanvas" width="390" height="760" aria-label="駐車ゲーム画面"></canvas>
      <div id="bestDisplay" class="best" aria-live="polite">BEST --</div>
      <div id="swipeHint" class="swipe-hint" hidden>上にスワイプ！</div>

      <div id="resultPanel" class="result-panel" hidden aria-live="assertive">
        <div id="resultMain" class="result-main"></div>
        <div id="resultSub" class="result-sub"></div>
        <button id="retryButton" class="primary-button retry" type="button">もう一回</button>
      </div>
    </section>
  </main>

  <script src="./game.js"></script>

  <script data-otg-visit-counter>
    (() => {
      const gameId = '002';
      const isPublished = location.hostname === 'ryg4mk.github.io';
      if (!isPublished) return;

      const sessionKey = 'otg-game-visit-' + gameId;
      try {
        if (sessionStorage.getItem(sessionKey) === '1') return;
        sessionStorage.setItem(sessionKey, '1');
      } catch {}

      const key = 'one_take_' + gameId + '_views_bkg_otg_20261008_v1';
      fetch('https://countapi.mileshilliard.com/api/v1/hit/' + encodeURIComponent(key), {
        credentials: 'omit',
        referrerPolicy: 'no-referrer',
        cache: 'no-store',
        keepalive: true
      }).catch(() => {});
    })();
  </script>
</body>
</html>
